<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>묵상 에세이</title>
  <style>
    @import url('https://cdn.jsdelivr.net/font-kopub/1.0/KoPubBatang.css');
    :root {
      --ink: #24302c;
      --muted: #68736f;
      --paper: #fffdf8;
      --canvas: #eef2ed;
      --green: #173f35;
      --green-soft: #e8f0eb;
      --gold: #b7863c;
      --gold-soft: #f7efdf;
      --line: #d9dfda;
      --body-size: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: var(--canvas);
      color: var(--ink);
      font-family: 'KoPub Batang', 'KoPubWorldBatang', serif;
      line-height: 1.8;
      word-break: keep-all;
    }
    main {
      max-width: 600px; margin: 0 auto;
      background: var(--paper);
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.03);
    }
    header {
      background: var(--green);
      color: var(--gold-soft);
      padding: 30px 24px 40px;
      text-align: left;
    }
    .label {
      font-size: 13px; font-weight: 500;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      margin: 0; font-size: 26px; font-weight: 700;
      line-height: 1.4; letter-spacing: -0.5px;
    }
    .toolbar {
      display: flex; gap: 8px;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
      overflow-x: auto;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    button {
      flex: 1; min-width: max-content;
      appearance: none; border: 1px solid var(--line);
      background: #fff; color: var(--muted);
      border-radius: 20px; padding: 8px 16px;
      font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all 0.2s;
    }
    button.primary {
      background: var(--green);
      color: #fff; border-color: var(--green);
    }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .content {
      padding: 40px 24px;
      font-size: var(--body-size);
      transition: font-size 0.3s ease;
    }
    .content p { margin: 0 0 24px 0; }
    .content h2, .content h3 {
      color: var(--green);
      margin: 40px 0 16px;
      line-height: 1.4;
    }
    /* 서브 타이틀 또는 섹션 타이틀이 흰색 본문에 묻히지 않도록 강제 색상 지정 */
    .content .subtitle, .content .section-title {
      display: block;
      color: var(--muted) !important;
      font-size: 16px !important;
      font-weight: 700;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .content hr {
      border: 0; height: 1px; background: var(--line);
      margin: 40px 0;
    }
    .content blockquote {
      margin: 0 0 24px; padding: 16px 20px;
      background: var(--green-soft);
      border-left: 3px solid var(--green);
      color: var(--green);
    }
    footer {
      padding: 40px 24px; text-align: center;
      background: var(--canvas); color: var(--muted);
      font-size: 13px; border-top: 1px solid var(--line);
    }
    #toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(36, 48, 44, 0.9); color: #fff;
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none; z-index: 100;
      white-space: nowrap;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0); opacity: 1;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="label">성경적 사고와 인격 만들기 &middot; 로마서 제 18편 &middot; 로마서 8:12-17</span>
      <h1>묵상 에세이</h1>
    </header>

    <div class="toolbar">
      <button class="primary" onclick="shareSermon()">공유하기</button>
      <button onclick="copySermon()">텍스트 복사</button>
      <button onclick="resizeText(1)">크게</button>
      <button onclick="resizeText(-1)">작게</button>
    </div>

    <article id="sermon" class="content">
      
    </article>

    <footer>
      #말씀과묵상 #성경적사고 #인격형성 #기독교에세이<br>
      로마서 제 18편
    </footer>
  </main>

  <div id="toast"></div>

  <script>
    let currentSize = 18;
    
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function sermonText() {
      const title = document.querySelector('h1').innerText;
      const content = document.getElementById('sermon').innerText;
      return `[${title}]\n\n${content}`;
    }

    async function copySermon() {
      try {
        await navigator.clipboard.writeText(sermonText());
        showToast('본문 텍스트가 복사되었습니다.');
      } catch (err) {
        showToast('복사 기능을 지원하지 않습니다.');
      }
    }

    async function shareSermon() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: document.title,
            url: window.location.href
          });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast('페이지 링크가 복사되었습니다.');
      } catch (e) {
        showToast('공유 기능을 지원하지 않는 환경입니다.');
      }
    }

    function resizeText(delta) {
      currentSize = Math.min(23, Math.max(16, currentSize + delta));
      document.documentElement.style.setProperty('--body-size', `${currentSize}px`);
      showToast(`본문 글씨 크기 ${currentSize}px`);
    }
  </script>
</body>
</html>
