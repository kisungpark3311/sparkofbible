<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말씀과 묵상 | 성경적 사고와 인격</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2b2b2b;
            --title-color: #1c3d5a;
            --accent-color: #3b82f6;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin: 40px 0;
        }

        .header h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.7rem;
            color: var(--title-color);
            margin-bottom: 12px;
            word-break: keep-all;
        }

        .header p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
        }

        .section-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.2rem;
            color: var(--title-color);
            margin: 40px 0 15px 5px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .list-item:hover, .list-item:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59,130,246,0.1);
            border-color: #bad0f5;
        }

        .item-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-family: 'Noto Serif KR', serif;
            color: var(--title-color);
        }

        .item-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #64748b;
        }

        .arrow {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px 0;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>성경적 사고와 인격 만들기</h1>
            <p>매일 한 편의 묵상 에세이를 통해<br>말씀이 우리의 인격이 되는 여정</p>
        </div>

        <h2 class="section-title">최신 묵상: 역대상 (9월)</h2>
        <div class="list-group" id="recent-list">
            <!-- 자바스크립트로 리스트 렌더링 -->
        </div>

        <h2 class="section-title">요한복음 묵상 (1~40편)</h2>
        <div class="list-group" id="essay-list">
            <!-- 자바스크립트로 리스트 렌더링 -->
        </div>

        <div class="footer">
            &copy; 성경적 사고와 인격 만들기. All rights reserved.
        </div>
    </div>

    <script>
        // 새로운 에세이 (역대상 9월 13일~30일)
        const recentContainer = document.getElementById('recent-list');
        for (let i = 13; i <= 30; i++) {
            const dateStr = `202609${String(i).padStart(2, '0')}`;
            const link = document.createElement('a');
            link.href = `./${dateStr}_인격만들기.html`;
            link.className = 'list-item';
            
            link.innerHTML = `
                <div class="item-info">
                    <h3>인격 만들기 (${i}일)</h3>
                    <p>역대상 묵상 에세이</p>
                </div>
                <div class="arrow">→</div>
            `;
            recentContainer.appendChild(link);
        }

        // 기존 요한복음 에세이 40개
        const listContainer = document.getElementById('essay-list');
        for (let i = 1; i <= 40; i++) {
            const numStr = String(i).padStart(2, '0');
            const link = document.createElement('a');
            link.href = `./${numStr}.html`;
            link.className = 'list-item';
            
            link.innerHTML = `
                <div class="item-info">
                    <h3>묵상 에세이 ${numStr}편</h3>
                    <p>요한복음 읽기</p>
                </div>
                <div class="arrow">→</div>
            `;
            listContainer.appendChild(link);
        }
    </script>
</body>
</html>
