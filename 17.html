<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>묵상 에세이</title>
  <style>
    @import url('https://cdn.jsdelivr.net/font-kopub/1.0/KoPubBatang.css');

    :root {
      --ink: #24302c;
      --muted: #68736f;
      --paper: #fffdf8;
      --canvas: #eef2ed;
      --green: #173f35;
      --green-soft: #e8f0eb;
      --gold: #b7863c;
      --gold-soft: #f7efdf;
      --line: #d9dfda;
      --body-size: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(183, 134, 60, .09), transparent 28rem),
        var(--canvas);
      font-family: 'KoPub Batang', 'KoPubWorldBatang', serif;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      background: var(--paper);
      min-height: 100vh;
      box-shadow: 0 14px 50px rgba(23, 63, 53, .12);
    }

    .hero {
      padding: 54px 36px 42px;
      color: #fff;
      background:
        linear-gradient(145deg, rgba(23, 63, 53, .97), rgba(35, 83, 70, .96)),
        var(--green);
      border-bottom: 5px solid var(--gold);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #e3d0a8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 54px);
      line-height: 1.18;
      letter-spacing: -.035em;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255, 253, 248, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #bfcac4;
      border-radius: 999px;
      color: var(--green);
      background: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    button:focus-visible {
      outline: 3px solid rgba(183, 134, 60, .45);
      outline-offset: 2px;
    }

    .content { padding: 38px 36px 52px; }

    h2 {
      margin: 46px 0 18px;
      color: var(--green);
      font-size: 28px;
      line-height: 1.38;
      letter-spacing: -.02em;
    }

    p {
      margin: 0 0 1.15em;
      font-size: var(--body-size);
      line-height: 1.92;
      letter-spacing: -.01em;
    }

    .quote {
      margin: 28px 0;
      padding: 22px 24px;
      color: #4b3a20;
      background: var(--gold-soft);
      border: 1px solid #ead9b9;
      border-radius: 14px;
      font-size: 19px;
      line-height: 1.75;
      font-style: italic;
    }

    footer {
      padding: 26px 30px 34px;
      color: var(--muted);
      background: #f2f4f1;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 20;
      padding: 11px 18px;
      color: #fff;
      background: rgba(26, 39, 34, .94);
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 600px) {
      .hero { padding: 40px 22px 32px; }
      .content { padding: 30px 21px 42px; }
      .toolbar { overflow-x: auto; }
      button { flex: 0 0 auto; }
      h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">성경적 사고와 인격 만들기 &middot; 요한복음 제 17편</p>
      <h1>묵상 에세이</h1>
    </header>

    <div class="toolbar">
      <button class="primary" onclick="shareSermon()">공유하기</button>
      <button onclick="copySermon()">텍스트 복사</button>
      <button onclick="resizeText(1)">크게</button>
      <button onclick="resizeText(-1)">작게</button>
    </div>

    <article id="sermon" class="content">
      
<p class="card-text">"망치를 내리치는 행위는 대상을 부수는 것입니까, 단단하게 벼리는 것입니까? 그것을 결정하는 것은 망치를 든 손이 아니라, 모루 위에 무엇이 놓여 있는가에 달렸습니다."</p>

    </article>

    <footer>
      #말씀과묵상 #성경적사고 #인격형성 #기독교에세이<br>
      요한복음 제 17편
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    let currentSize = 18;

    function sermonText() {
      const article = document.getElementById('sermon').innerText.trim();
      return `묵상 에세이\\n요한복음 제 17편\\n\\n${article}\\n\\n#말씀과묵상`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function copySermon() {
      try {
        await navigator.clipboard.writeText(sermonText());
        showToast('내용을 복사했습니다. 카카오톡에 붙여넣으세요.');
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = sermonText();
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        showToast('내용을 복사했습니다.');
      }
    }

    async function shareSermon() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: '묵상 에세이',
            url: window.location.href
          });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast('페이지 링크가 복사되었습니다.');
      } catch (e) {
        showToast('공유 기능을 지원하지 않는 환경입니다.');
      }
    }

    function resizeText(delta) {
      currentSize = Math.min(23, Math.max(16, currentSize + delta));
      document.documentElement.style.setProperty('--body-size', `${currentSize}px`);
      showToast(`본문 글씨 크기 ${currentSize}px`);
    }
  </script>
</body>
</html>
